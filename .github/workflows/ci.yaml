          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  test_docs_build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: tj-actions/changed-files@v47.0.6
      id: changed-files
      with:
        files: |
          docs/**
          package*.json
    - uses: actions/setup-node@v7.0.0
      if: ('push' == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true')
      with:
        node-version: 24
        cache: npm
    - run: npm ci
      if: ('push' == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true')
    - run: npm run docs:build
      if: ('push' == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true')
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
